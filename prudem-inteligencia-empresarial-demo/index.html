/* IA em cada módulo — painel de interpretação de dados e preenchimento guiado */
.ai-shell{border:1px solid #b8dfda;background:linear-gradient(160deg,#fff 0%,#f6fcfa 100%)}
.ai-eyebrow{font-size:10px;font-weight:860;letter-spacing:.14em;color:#07817b;margin-bottom:8px}
.ai-intro{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0}
.ai-intro>div{border:1px solid #d8e8e7;border-radius:11px;background:white;padding:13px 15px}
.ai-intro b,.ai-guide b,.ai-conversation b{font-size:12px;color:#25475b}
.ai-intro p{color:#617688;font-size:11px;line-height:1.6;margin:5px 0 0}
.ai-summary{padding:16px;border-radius:10px;background:#e9f6f4;border-left:4px solid #158a83;margin-bottom:12px;font-size:12px}
.ai-summary b{color:#12545b}
.ai-summary p{margin:6px 0 0;color:#416d71;line-height:1.6}
.ai-findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}
.ai-finding{display:flex;gap:9px;padding:13px 12px;background:white;border:1px solid #dce8e9;border-radius:10px;font-size:11px;color:#476579;line-height:1.5}
.ai-finding>b{color:#20465d}
.ai-finding b{color:#284a60}
.ai-finding small{display:block;margin-top:8px;font-size:10px;line-height:1.5;color:#617a84}
.ai-finding.attention{border-color:#f2d49c;background:#fffaf1}
.ai-finding.positive{border-color:#b8e2d5;background:#f2fcf6}
.ai-dot{width:9px;height:9px;flex-shrink:0;background:#299f94;border-radius:100%;margin-top:4px}
.ai-finding.attention .ai-dot{background:#db9e37}
.ai-guide{background:white;border:1px solid #deebed;border-radius:11px;padding:14px 16px;margin-bottom:15px}
.ai-guide>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai-guide ol{padding-left:19px;margin:8px 0 0;color:#567287;font-size:11px;line-height:1.75}
.ai-conversation{background:white;border:1px solid #dce9ec;border-radius:12px;padding:17px}
.ai-chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 14px}
.ai-chip{border:1px solid #bcd6d9;background:#eff8f8;color:#286779;font-size:10.5px;font-weight:650;padding:8px 10px;border-radius:22px;cursor:pointer;line-height:1.3}
.ai-chip:hover{background:#dcf1ee}
.ai-messages{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;padding:2px 0 12px}
.ai-chat-empty{color:#798e99;font-size:11px;padding:12px;background:#f8fafb;border-radius:9px}
.ai-message{padding:12px 14px;border-radius:11px;background:#f0f6f7;border:1px solid #e0ecee;font-size:11.5px;line-height:1.6;overflow-wrap:anywhere;white-space:normal}
.ai-user{margin-left:10%;background:#e8f5f2;border-color:#bde4d9}
.ai-author{font-size:10px;font-weight:820;margin-bottom:5px;color:#227a74}
.ai-user .ai-author{color:#587383}
.ai-body{color:#28475c}
.ai-q-label{display:block;margin:9px 0 7px;font-size:11px;font-weight:750;color:#33596b}
#ai-question{width:100%;border:1px solid #cfdde3;border-radius:9px;padding:12px;color:#2c4455;font-size:12px;resize:vertical;min-height:70px;line-height:1.5}
#ai-question:focus{outline:2px solid #b6ded8;border-color:#168d85}
.ai-controls{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:10px}
.ai-disclaimer{font-size:10px;color:#7b8d98;line-height:1.65;margin-top:12px}
@media(max-width:1100px){.ai-findings{grid-template-columns:1fr}}
@media(max-width:650px){.ai-intro{grid-template-columns:1fr}.ai-conversation{padding:12px}.ai-controls .btn{flex:1}}
@media print{.ai-chips,.ai-messages,.ai-controls,#assistant-form{display:none}.ai-conversation{border:0;padding:0}}
.nav-ai{font-size:9px;line-height:1;font-weight:800;color:#71c9bf;border:1px solid #30637b;border-radius:4px;padding:3px 4px;margin-left:4px}
.report-ai-item{border:1px solid #dae7e9;border-radius:9px;margin:8px 0;padding:12px 14px;background:#fbfdfc}
.report-ai-item .flex-row b{font-size:12px;color:#245369}
.report-ai-item p{font-size:11px;color:#577385;line-height:1.7;margin:7px 0 0}

function regression(ts){let r=ts.filter(x=>Number.isFinite(x.y));if(r.length<6)return null;let y=r.map(x=>x.y);const fit=arr=>{let xs=arr.map((_,i)=>i),n=arr.length,xm=(n-1)/2,ym=avg(arr),den=xs.reduce((s,x)=>s+(x-xm)**2,0),b=den?xs.reduce((s,x,i)=>s+(x-xm)*(arr[i]-ym),0)/den:0;return {a:ym-b*xm,b}};let b=fit(y.slice(0,-3));let test=y.slice(-3);let preds=test.map((_,i)=>b.a+b.b*(y.length-3+i));let mae=avg(test.map((v,i)=>Math.abs(v-preds[i]))),mape=avg(test.map((v,i)=>v>0?100*Math.abs(v-preds[i])/v:NaN));let whole=fit(y);let last=monthKey(r.at(-1).x+'-01'),d=new Date(last+'-01T12:00:00');d.setMonth(d.getMonth()+1);let next=d.toISOString().slice(0,7);return {n:r.length,next,pred:Math.max(0,whole.a+whole.b*y.length),mae,mape,trend:whole.b};}
function modelsPage(){let s=timeSeries('vendas');let f=regression(s);return `${header('Modelos de inteligência artificial','Catálogo dos 13 modelos e seus requisitos. Nesta versão, apenas a regressão linear ilustrativa abaixo é calculada; os demais estão especificados para evolução técnica.')}${banner()}<div class="grid-equal"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">Previsão inicial de vendas</h2><p class="panel-sub">Regressão linear simples sobre faturamento mensal registrado em Vendas.</p></div><span class="tag ${f?'teal':'amber'}">${f?'Cálculo disponível':'Dados insuficientes'}</span></div>${f?`<div class="metric-grid" style="grid-template-columns:1fr 1fr">${kpi('Próximo mês · '+f.next,money(f.pred))}${kpi('Erro absoluto médio',money(f.mae),'Últimos 3 meses não usados no ajuste de teste')}${kpi('Erro percentual médio',pct(f.mape),'MAPE sobre 3 meses')}${kpi('Meses utilizados',fmt(f.n))}</div><div class="notice warning"><strong>Experimento, não recomendação de negócio.</strong> Modelo de tendência sem sazonalidade, variáveis externas ou intervalos de previsão validados. O erro mostrado é de um único corte temporal ilustrativo. Verifique se o modelo supera um baseline ingênuo antes de usá-lo.</div>`:empty('São necessários pelo menos 6 meses com vendas para essa demonstração de regressão.')}</div><div class="panel"><h2 class="panel-title">Escolha técnica responsável</h2><div class="checklist">${['Definir uma variável-alvo de negócio e uma métrica de erro','Confirmar que existem dados históricos suficientes','Separar treino, validação e teste sem vazamento temporal','Comparar com métodos simples e modelos candidatos','Examinar estabilidade, vieses e explicabilidade','Documentar versão, responsáveis e data de treinamento','Monitorar queda de desempenho após implantação'].map(t=>`<div class="check-item"><span class="good">✓</span><span>${t}</span></div>`).join('')}</div></div></div><div class="panel"><h2 class="panel-title">Biblioteca de modelos aplicáveis</h2><p class="panel-sub">Todos estão documentados; execução avançada demanda motor Python e serviços de computação no backend.</p><div class="model-list">${cfg.algorithms.map((x,i)=>`<div class="model-card"><div class="flex-row"><h3>${String(i+1).padStart(2,'0')}. ${esc(x.name)}</h3><span class="tag ${i===0?'teal':'amber'}">${i===0?'Protótipo':'Não treinado'}</span></div><p>${esc(x.what)}</p><div class="kv"><b>Onde aplicar</b><span>${esc(x.areas)}</span><b>Dados necessários</b><span>${esc(x.inputs)}</span><b>O que entrega</b><span>${esc(x.outputs)}</span></div><div class="hint"><b>Limite:</b> ${esc(x.caution)}</div></div>`).join('')}</div></div>`}
function reportsPage(){let sf=statsFor('financeiro',records('financeiro')),sv=statsFor('vendas',records('vendas')),sm=statsFor('marketing',records('marketing')),q=MODS.filter(m=>records(m.id).length),ins=[];let fin=records('financeiro'),r=sum(fin.filter(x=>x.tipo==='Receita'),'valor'),d=sum(fin.filter(x=>x.tipo==='Despesa'),'valor');if(fin.length)ins.push({t:'Financeiro',body:`Receitas lançadas de ${money(r)} e despesas lançadas de ${money(d)}, resultando em ${money(r-d)} no intervalo registrado. Isso não representa necessariamente lucro ou caixa disponível.`});if(records('vendas').length)ins.push({t:'Comercial',body:`O valor de vendas concluídas registrado é ${sv[0].value}, com ${sv[1].value} pedidos. Confira se preços, descontos e custos foram preenchidos corretamente.`});if(records('marketing').length)ins.push({t:'Marketing',body:`Investimento declarado de ${sm[0].value} e ROAS informado de ${sm[3].value}. A interpretação exige confirmar o método de atribuição de receita a campanhas.`});if(records('estoque').length){let st=statsFor('estoque',records('estoque'));ins.push({t:'Estoque',body:`Existem ${st[1].value} itens na condição de estoque mínimo ou inferior na última posição disponível por produto.`})}const aiPriorities=MODS.map(m=>({m,rep:aiReport(m)})).filter(x=>x.rep.recordCount>0);return `${header('Relatório executivo','Síntese baseada apenas nos registros cadastrados. Sem decisões inventadas ou conclusões geradas por um modelo de linguagem.',button('Imprimir / salvar em PDF','print','primary'))}${banner()}<div class="panel"><div class="flex-row"><div><div class="eyebrow">Diagnóstico empresarial · Rascunho</div><h2 class="panel-title" style="font-size:22px">${esc(company().name)}</h2><p class="panel-sub">Setor: ${esc(company().sector)} · Emitido em ${new Date().toLocaleDateString('pt-BR')} · ${q.length} módulos com dados</p></div><span class="tag amber">Não auditado</span></div><div class="metric-grid">${(sf.length?sf:sv).map(x=>kpi(x.label,x.value,x.hint)).join('')}</div><h3>Constatações observáveis</h3>${ins.length?ins.map(x=>`<div class="summary-card"><b>${esc(x.t)}</b><p>${esc(x.body)}</p></div>`).join(''):empty()}<h3>Prioridades e recomendações dos 14 copilotos</h3><p class="panel-sub">Regras analíticas locais recalculadas com dados do cliente selecionado. Os itens abaixo são hipóteses de gestão a confirmar com as equipes.</p>${aiPriorities.length?aiPriorities.map(x=>{let alertas=x.rep.findings.filter(f=>f.kind==='attention').slice(0,2);let items=alertas.length?alertas:x.rep.findings.filter(f=>f.kind==='info').slice(0,1);return `<div class="report-ai-item"><div class="flex-row"><b>${esc(x.m.name)}</b><span class="tag">${x.rep.recordCount} registros</span></div>${items.map(f=>`<p><b>${esc(f.title)}:</b> ${esc(f.evidence)} <strong>Próxima ação:</strong> ${esc(f.action)}</p>`).join('')}</div>`}).join(''):empty('Adicione dados para gerar recomendações por módulo.')}<h3>Limitações e verificações necessárias</h3><div class="checklist">${['Indicadores calculados exclusivamente a partir dos registros disponíveis.','Conferir se o período observado é comparável entre os módulos.','Valores negativos, duplicidades e categorias inconsistentes podem alterar resultados.','Causalidade, retorno sobre investimento e eficácia de ações demandam desenho analítico adicional.','A plataforma não substitui auditoria contábil, financeira, trabalhista ou clínica.'].map(x=>`<div class="check-item"><span class="good">•</span>${x}</div>`).join('')}</div></div>`}
function modalFrame(title,body,foot,small=false){return `<div class="modal-shade" id="modal-shade"><div class="modal ${small?'small':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Fechar">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`}
function createCompany(){const b=`<form id="company-form"><div class="form-grid"><div class="form-group full"><label>Nome da empresa *</label><input name="name" placeholder="Ex.: Empresa Central" maxlength="80" required></div><div class="form-group full"><label>Setor principal *</label><select name="sector" required>${cfg.sectors.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="form-group full"><small>Cria um espaço vazio, sem compartilhamento de registros. Na produção, o cadastro deverá exigir autenticação e autorização contratual.</small></div></div></form>`;modal=modalFrame('Cadastrar novo cliente',b,button('Cancelar','close-modal')+`<button class="btn primary" form="company-form" type="submit">Criar empresa</button>`,true);render()}
function addRecord(edit=null){let m=MODS.find(x=>x.id===state.page)||MODS.find(x=>x.id==='financeiro');let fields=m.fields.map(f=>{let value=edit?.[f.id]??'',input=f.type==='select'?`<select name="${esc(f.id)}" ${f.required?'required':''}><option value="">Selecione</option>${f.options.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${esc(f.id)}" type="${f.type==='date'?'date':f.type==='number'?'number':'text'}" ${f.type==='number'?'step="any"':''} ${f.required?'required':''} ${f.id===m.primary&&edit?'readonly':''} placeholder="${esc(f.example)}" value="${esc(value)}">`;return `<div class="form-group"><label>${esc(f.label)} ${f.required?'*':''}</label>${input}<small>${esc(f.help)}<br><b>Ex.:</b> ${esc(f.example)}</small></div>`}).join('');modal=modalFrame((edit?'Editar':'Adicionar')+' · '+m.name,`<form id="record-form" data-module="${m.id}" data-original="${edit?esc(edit[m.primary]):''}"><div class="form-grid">${fields}</div></form>`,button('Cancelar','close-modal')+`<button class="btn primary" type="submit" form="record-form">${edit?'Salvar alteração':'Salvar registro'}</button>`);render()}
function importModal(){const m=MODS.find(x=>x.id===state.page)||MODS[0];importBuffer={module:m.id,rows:[],headers:[],mapping:{}};let b=`<div class="notice"><strong>Importe planilha CSV exportada do Excel.</strong> Para arquivos .xlsx, escolha <b>Salvar como → CSV UTF-8</b>. O sistema reconhece delimitadores ; , ou TAB, e sugere o mapeamento das colunas. Os registros serão adicionados à empresa selecionada.</div><div class="form-group"><label>Escolha o módulo de destino</label><select id="import-module">${MODS.map(x=>`<option value="${x.id}" ${m.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="form-group" style="margin-top:18px"><label>Arquivo CSV (UTF-8)</label><input type="file" accept=".csv,.txt,text/csv" id="import-file"></div><div id="import-preview" style="margin-top:17px">${empty('Selecione um CSV para visualizar e conferir as colunas antes da importação.')}</div>`;modal=modalFrame('Importar dados da empresa',b,button('Cancelar','close-modal')+`<button class="btn primary" data-action="commit-import" id="commit-import" disabled>Validar e importar</button>`);render()}
function csvParse(text){text=String(text).replace(/^\ufeff/,'');let first=text.split(/\r?\n/)[0]||'';let del=[';',',','\t'].map(x=>({x,n:first.split(x).length})).sort((a,b)=>b.n-a.n)[0].x;let rows=[],cur='',line=[],quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cur+='"';i++}else if(ch==='"')quoted=false;else cur+=ch}else if(ch==='"')quoted=true;else if(ch===del){line.push(cur);cur=''}else if(ch==='\r'||ch==='\n'){if(ch==='\r'&&text[i+1]==='\n')i++;line.push(cur);if(line.some(s=>String(s).trim()))rows.push(line);cur='';line=[]}else cur+=ch;}line.push(cur);if(line.some(s=>String(s).trim()))rows.push(line);let headers=rows.shift()||[];return {headers:headers.map(x=>x.trim()),rows:rows.map(r=>headers.reduce((o,h,i)=>(o[h]=(r[i]??'').trim(),o),{}))}}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
function previewImport(){let m=MODS.find(x=>x.id===importBuffer.module),{headers,rows}=importBuffer;if(!headers.length){$('#import-preview').innerHTML=empty('O arquivo precisa conter cabeçalho.');return}let b=`<h3 class="panel-title">Mapeamento de colunas</h3><p class="hint">${rows.length} linhas encontradas. Confira as sugestões e selecione colunas de origem para cada campo obrigatório.</p><div class="import-map">${m.fields.map(f=>`<div class="form-group"><label>${esc(f.label)} ${f.required?'*':''}</label><select data-map="${f.id}"><option value="">Não importar</option>${headers.map(h=>`<option value="${esc(h)}" ${importBuffer.mapping[f.id]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div><p class="hint" style="margin-top:16px">Exemplo de linha 1: ${esc(JSON.stringify(rows[0]||{})).slice(0,350)}</p>`;$('#import-preview').innerHTML=b;$('#commit-import').disabled=!rows.length;}
function chooseImportFile(file){if(!file)return;if(file.size>5*1024*1024){alert('Limite deste protótipo: 5 MB por CSV.');return}let reader=new FileReader();reader.onload=()=>{let x=csvParse(reader.result),m=MODS.find(k=>k.id===importBuffer.module),map={};for(let f of m.fields){let match=x.headers.find(h=>norm(h)===norm(f.id))||x.headers.find(h=>norm(h)===norm(f.label));if(match)map[f.id]=match;}importBuffer.headers=x.headers;importBuffer.rows=x.rows;importBuffer.mapping=map;previewImport()};reader.readAsText(file,'UTF-8')}
function commitImport(){let m=MODS.find(x=>x.id===importBuffer.module),required=m.fields.filter(f=>f.required),missing=required.filter(f=>!importBuffer.mapping[f.id]);if(missing.length)return alert('Mapeie os campos obrigatórios: '+missing.map(x=>x.label).join(', '));let data=company().data[m.id]||[],seen=new Set(data.map(x=>String(x[m.primary]))),errors=[],added=0,duplicates=0,limit=5000;for(let [i,raw]of importBuffer.rows.slice(0,limit).entries()){let row={};for(let f of m.fields){let v=(raw[importBuffer.mapping[f.id]]??'').trim();if(v&&f.type==='number')v=num(v);if(v&&f.type==='date'&&/^\d{2}\/\d{2}\/\d{4}$/.test(v)){let [d,mo,y]=v.split('/');v=`${y}-${mo}-${d}`}row[f.id]=v;}if(required.some(f=>row[f.id]===''||row[f.id]===null)){errors.push(i+2);continue}if(!row[m.primary]){errors.push(i+2);continue}if(seen.has(String(row[m.primary]))){duplicates++;continue}seen.add(String(row[m.primary]));data.push(row);added++;}company().data[m.id]=data;persist();modal=null;state.page=m.id;state.tab='dados';state.query='';render();alert(`Importação concluída: ${added} inseridos, ${duplicates} IDs duplicados ignorados e ${errors.length} linhas com campos obrigatórios ausentes. ${importBuffer.rows.length>limit?'Limite de 5.000 linhas por lote.':''}`)}
function downloadCSV(m,template=false){let fields=m.fields;const safe=s=>{let text=String(s??'').replace(/"/g,'""');if(/^[=+@\-]/.test(text)&&!/^\-?\d+(\.\d+)?$/.test(text))text="'"+text;return '"'+text+'"'};let rows=template?[]:records(m.id),head=fields.map(f=>safe(f.id)).join(';'),body=rows.map(r=>fields.map(f=>safe(r[f.id])).join(';'));if(template){body.push(fields.map(f=>safe(f.example)).join(';'));}let csv='\ufeff'+[head,...body].join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(template?'MODELO_':'DADOS_')+m.id.toUpperCase()+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function downloadGuides(){const map={};for(let m of MODS)map[m.id]={descricao:m.desc,granularidade:m.grain,campos:m.fields};let blob=new Blob([JSON.stringify(map,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dicionario_campos.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function addCompanyFromForm(fd){let name=String(fd.get('name')||'').trim(),sector=String(fd.get('sector')||'').trim();if(!name||!sector)return;let id='C'+Date.now();state.companies.push({id,name,sector,demo:false,data:{}});state.current=id;state.page='dashboard';state.tab='dados';modal=null;persist();render()}
function saveRecord(form){let m=MODS.find(x=>x.id===form.dataset.module),original=form.dataset.original,data=company().data[m.id]||[],fd=new FormData(form),row={};for(let f of m.fields){let raw=String(fd.get(f.id)??'').trim();if(f.required&&!raw)return alert('Preencha '+f.label);if(f.type==='number')row[f.id]=raw===''?'':num(raw);else row[f.id]=raw;}let i=original?data.findIndex(x=>String(x[m.primary])===original):-1;if(i<0&&data.some(x=>String(x[m.primary])===String(row[m.primary])))return alert('O identificador principal já existe. Utilize um ID único.');if(i>=0)data[i]=row;else data.push(row);company().data[m.id]=data;modal=null;persist();render()}
function runAction(act){let m=MODS.find(x=>x.id===state.page)||MODS[0];switch(act){case'new-company':return createCompany();case'close-modal':modal=null;render();return;case'add-record':return addRecord();case'open-import':return importModal();case'template-csv':return downloadCSV(m,true);case'export-csv':return downloadCSV(m,false);case'commit-import':return commitImport();case'to-quality':state.page='quality';break;case'to-stats':state.page='statistics';break;case'print':window.print();return;case'mobile-menu':sidebarOpen=!sidebarOpen;break;case'export-guides':downloadGuides();return;case'assist-fields':state.tab='campos';break;case'assist-remote':{let form=$('#assistant-form');if(!form)return;let q=String(new FormData(form).get('question')||'').trim();if(!q){alert('Escreva uma pergunta para a IA generativa.');return;}assistantAsk(state.page,q,true);return;}default:if(act.startsWith('company:')){state.current=act.slice(8);state.page='dashboard';state.tab='dados';state.query='';sidebarOpen=false}else if(act.startsWith('remove-company:')){let id=act.slice(15);if(!confirm('Excluir completamente este cliente do armazenamento local deste navegador?'))return;state.companies=state.companies.filter(c=>c.id!==id);state.current=state.companies[0].id;state.page='companies';}}
 persist();render();}
document.addEventListener('click',e=>{let quick=e.target.closest('[data-ai-question]');if(quick){assistantAsk(state.page,quick.dataset.aiQuestion,false);return;}let a=e.target.closest('[data-action]');if(a)return runAction(a.dataset.action);let p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;state.tab='dados';state.query='';sidebarOpen=false;persist();render();return}let t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render();return}let edit=e.target.closest('[data-edit]');if(edit){let m=MODS.find(x=>x.id===state.page),x=records(m.id).find(x=>String(x[m.primary])===edit.dataset.edit);return addRecord(x)}let del=e.target.closest('[data-delete]');if(del){let m=MODS.find(x=>x.id===state.page);if(confirm('Excluir o registro selecionado? Esta ação não poderá ser desfeita.')){company().data[m.id]=records(m.id).filter(x=>String(x[m.primary])!==del.dataset.delete);persist();render()}return}if(e.target.id==='modal-shade'){modal=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='assistant-form'){e.preventDefault();assistantAsk(e.target.dataset.module,new FormData(e.target).get('question'),false);return;}if(e.target.id==='company-form'){e.preventDefault();addCompanyFromForm(new FormData(e.target))}if(e.target.id==='record-form'){e.preventDefault();saveRecord(e.target)}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='tenant-select'){state.current=t.value;state.tab='dados';state.query='';persist();render()}else if(t.id==='stat-module'){state.statModule=t.value;state.statField=MODS.find(x=>x.id===t.value).fields.find(f=>f.type==='number')?.id;render()}else if(t.id==='stat-field'){state.statField=t.value;render()}else if(t.id==='import-module'){importBuffer.module=t.value;importBuffer.headers=[];importBuffer.rows=[];importBuffer.mapping={};$('#import-file').value='';$('#import-preview').innerHTML=empty('Selecione um arquivo para este módulo.');$('#commit-import').disabled=true}else if(t.id==='import-file'){chooseImportFile(t.files[0])}else if(t.dataset.map){importBuffer.mapping[t.dataset.map]=t.value}});
document.addEventListener('input',e=>{if(e.target.id==='search-rows'){state.query=e.target.value;let pos=e.target.selectionStart;render();let x=$('#search-rows');if(x){x.focus();try{x.setSelectionRange(pos,pos)}catch{}}}});
render();
